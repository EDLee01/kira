name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  capability:
    name: Capability alignment
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Kira capability report
        run: npm run report:capability

      - name: Build app bundles
        run: npm run build

      - name: Upload Kira reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kira-capability-reports
          path: .kira-reports/*.json
          include-hidden-files: true
          if-no-files-found: warn
