appId: com.magi.desktop
productName: Magi Desktop
directories:
  output: release
  buildResources: build
asar: true
files:
  - dist/**/*
  - package.json
  - node_modules/**/*
mac:
  target: dmg
  artifactName: Magi-Desktop-${version}-mac.${ext}
  category: public.app-category.productivity
win:
  target: nsis
  artifactName: Magi-Desktop-Setup-${version}.${ext}
linux:
  target: AppImage
  artifactName: Magi-Desktop-${version}.${ext}
