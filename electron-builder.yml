appId: com.kira.app
productName: Kira
directories:
  output: release
  buildResources: build
asar: true
files:
  - dist/**/*
  - package.json
  - node_modules/**/*
mac:
  target: dmg
  artifactName: Kira-${version}-mac.${ext}
  category: public.app-category.productivity
win:
  target: nsis
  artifactName: Kira-Setup-${version}.${ext}
linux:
  target: AppImage
  artifactName: Kira-${version}.${ext}
